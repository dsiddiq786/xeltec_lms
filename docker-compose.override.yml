services:
  postgres:
    ports:
      - "5432:5432"

  lms-backend:
    environment:
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost
      - CORS_ORIGIN=http://localhost,http://localhost:80
      - RESEND_API_KEY=${RESEND_API_KEY:-}

  lms-frontend:
    depends_on:
      lms-backend:
        condition: service_started

  proxy:
    volumes:
      - ./deploy/nginx/proxy-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lms-backend:
        condition: service_started
      lms-frontend:
        condition: service_started

  certbot:
    profiles:
      - production
