services:
  # ---------------------------------------------------------------------------
  # Database Services
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-network

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - lms-network

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-network

  # ---------------------------------------------------------------------------
  # LMS Backend (NestJS)
  # ---------------------------------------------------------------------------
  lms-backend:
    build:
      context: ./lms-backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lms_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-900}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-604800}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://lms.xeltecdev.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://lms.xeltecdev.com}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-console}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@brickskill.com}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_LOCAL_DIR=/app/uploads
      - AI_SERVICE_URL=http://api:8000
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-network

  # ---------------------------------------------------------------------------
  # LMS Frontend (React SPA)
  # ---------------------------------------------------------------------------
  lms-frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: /
    restart: always
    depends_on:
      lms-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - lms-network

  # ---------------------------------------------------------------------------
  # AI Course Generator (Python FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: always
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - GENERATED_COURSES_DIR=/app/Generated_Courses
    volumes:
      - generated_courses:/app/Generated_Courses
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-network

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: always
    command: python -m app.worker.course_worker
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - GENERATED_COURSES_DIR=/app/Generated_Courses
    volumes:
      - generated_courses:/app/Generated_Courses
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'course_worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - lms-network

  # ---------------------------------------------------------------------------
  # Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      lms-backend:
        condition: service_healthy
      lms-frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - lms-network

  # ---------------------------------------------------------------------------
  # SSL Certificate Management
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
  redis_data:
  postgres_data:
  generated_courses:
  uploads_data:

networks:
  lms-network:
    driver: bridge
